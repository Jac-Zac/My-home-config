# Tmux colors to map my default colors 
set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",xterm-256color:Tc,screen-256color*:Tc,tmux-256color:Tc"
set -ga terminal-overrides "*:kitty,*:ghostty"
set -ga terminal-features ",ghostty*:extclipboard"

# Set modifier key for tmux
unbind C-b
# Set alt a as my prefix key
set-option -g prefix C-a
bind C-a send-prefix

bind-key x kill-pane             # skip "kill-pane 1? (y/n)" prompt
set -g base-index 1              # Start indexing from 1
set -g mouse on                  # Enable mouse use 
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set-option -g status-left-length 50

# To enable for images in nvim
set -g allow-passthrough on

# 1. Catch the specific Ghostty code and convert it to a generic Ctrl+Enter
set -s extended-keys on

setw -g mode-keys vi
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Other settings
bind * list-clients
bind j next-window      # Prefix j: next window (right in list)
bind k previous-window  # Prefix k: previous window (left in list)

# Move (swap) windows
bind -n S-Left  swap-window -t -1
bind -n S-Right swap-window -t +1

bind r command-prompt "rename-window %%"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Additional config
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'

set -g @plugin 'Jac-Zac/nord-tmux' # My fork with nord theme
set -g @plugin 'tmux-plugins/tmux-battery'

# Old configuration
# set -g @plugin "nordtheme/tmux"
# set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# set -g @prefix_highlight_show_copy_mode 'on'
# set -g @prefix_highlight_prefix_prompt 'Wait'
# set -g @prefix_highlight_copy_prompt 'Copy'

# set -g @sshx-bind 's'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'gray'
set -g @floax-text-color 'white'
set -g @floax-change-path 'false'

# My Custom keybindings
bind g display-popup -E -xC -yC -w 80% -h 80% -d "#{pane_current_path}" lazygit
bind-key R send-keys 'cd "$(tmux display-message -pF "#{session_path}")"' Enter
unbind n
bind n if-shell "tmux select-window -t code" "" "new-window; rename-window 'code'; send-keys 'vim' Enter"

# Custom bindings
unbind C-p
set -g @floax-bind '-n C-p' # To start it with control p
set -g @floax-bind-menu 'm'    # Prefix+m for floax menu instead of k

# Using tv as a fuzy finder for sesh
bind-key "t" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'sesh' tv sesh

# Using tv as a fuzzy finder for ssh windows
bind-key "S" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'ssh-switcher' tv ssh-hosts

set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf|tv)(diff)?(-wrapped)?'

run '~/.config/tmux/plugins/tpm/tpm'
